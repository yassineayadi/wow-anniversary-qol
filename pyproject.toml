[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-wa-project"
version = "0.1.0"
description = "Programmatic WeakAuras editing and export workflow"
requires-python = ">=3.10"
dependencies = ["lupa>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wa = "wa_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
